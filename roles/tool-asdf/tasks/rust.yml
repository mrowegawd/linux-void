---
- name: ASDF-Rust | Check plugin-list if spesific our lang is exists
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    /home/{{ user_admin }}/.local/bin/asdf list rust
  args:
    executable: /bin/bash
  register: plugin_rust_exists
  changed_when: false
  failed_when: false
  ignore_errors: true
  tags:
    - asdf
    - rust

# - name: ASDF-Rust | Debug plugin_rust_exists 2
#   ansible.builtin.debug:
#     msg: "{{ plugin_rust_exists }}"

- name: ASDF-Rust | Install asdf plugin for rust
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    /home/{{ user_admin }}/.local/bin/asdf {{ rust_lang.plugin_asdf_install }}
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - plugin_rust_exists.stderr | length > 0
  tags:
    - asdf
    - rust

- name: ASDF-Rust | Check rust version if exists
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    rustc --version
  args:
    executable: /bin/bash
  environment:
    PATH: "/home/{{ user_admin }}/.asdf/shims:{{ lookup('env', 'PATH') }}"
  register: rust_version_cur_version
  changed_when: false
  failed_when: false
  ignore_errors: true
  tags:
    - asdf
    - rust

# - name: ASDF-Rust | Debug plugin_rust_exists!
#   ansible.builtin.debug:
#     msg: "{{ rust_version_cur_version }}"

- name: "ASDF-Rust | Install rust"
  when:
    - rust_version_cur_version.stderr | length > 0
  tags:
    - asdf
    - rust
  block:
    - name: ASDF-Rust | Ensure apt packages are managed | Debian
      become: true
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items:
        - "{{ rust_lang.plugin_asdf_deps }}"
      when:
        - rust_lang.plugin_asdf_deps | length > 0
        - ansible_os_family | lower == 'debian'
      tags:
        - asdf
        - rust

    - name: ASDF-Rust | Ensure yum packages are managed | Redhat
      become: true
      ansible.builtin.yum:
        name: "{{ item }}"
        state: "{{ _apt_state }}"
      vars:
        state: '{{ _apt_state | default("present") }}'
      with_items:
        - "{{ rust_lang.plugin_asdf_deps }}"
      when:
        - rust_lang.plugin_asdf_deps | length > 0
        - ansible_os_family | lower == 'redhat'
      tags:
        - asdf
        - rust

    - name: ASDF-Rust | Install rust version
      become: true
      become_user: "{{ user_admin }}"
      ansible.builtin.shell: |
        /home/{{ user_admin }}/.local/bin/asdf install rust {{ rust_lang.plugin_asdf_rust_version }}
      args:
        executable: /bin/bash
      changed_when: false
      register: rust_version_installed
      tags:
        - asdf
        - rust

    - name: ASDF-Rust | Set global for rust version on .tool_version
      become: true
      become_user: "{{ user_admin }}"
      ansible.builtin.shell: |
        /home/{{ user_admin }}/.local/bin/asdf set --home rust {{ rust_lang.plugin_asdf_rust_version }}
      args:
        executable: /bin/bash
      changed_when: false
      environment:
        PATH: "/home/{{ user_admin }}/.local/bin:{{ lookup('env', 'PATH') }}"
      when:
        - rust_version_installed is success
      tags:
        - asdf
        - rust
