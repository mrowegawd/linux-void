---
- name: ASDF-Nodejs | Check plugin-list if spesific our lang is exists
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    /home/{{ user_admin }}/.local/bin/asdf list nodejs
  args:
    executable: /bin/bash
  register: plugin_nodejs_exists
  changed_when: false
  failed_when: false
  ignore_errors: true
  tags:
    - asdf
    - nodejs

# - name: ASDF-Nodejs | Debug plugin_nodejs_exists!
#   ansible.builtin.debug:
#     msg: "{{ plugin_nodejs_exists.stdout.find('nodejs') }}"

- name: ASDF-Nodejs | Install asdf plugin for nodejs
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    /home/{{ user_admin }}/.local/bin/asdf {{ nodejs_lang.plugin_asdf_install }}
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - plugin_nodejs_exists.stderr | length > 0
  tags:
    - asdf
    - nodejs

- name: ASDF-Nodejs | Check nodejs version if exists
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    node --version
  args:
    executable: /bin/bash
  environment:
    PATH: "/home/{{ user_admin }}/.asdf/shims:{{ lookup('env', 'PATH') }}"
  register: nodejs_version_cur_version
  changed_when: false
  failed_when: false
  ignore_errors: true
  tags:
    - nodejs
    - asdf

# - name: ASDF-Nodejs | Debug plugin_nodejs_exists!
#   ansible.builtin.debug:
#     msg: "{{ nodejs_version_cur_version.stdout.find(nodejs_version) }}"

- name: "ASDF-Nodejs | Install nodejs"
  when:
    - nodejs_version_cur_version.stderr | length > 0
  tags:
    - asdf
    - nodejs
  block:
    - name: ASDF-Nodejs | Ensure apt packages are managed | Debian
      become: true
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items:
        - "{{ nodejs_lang.plugin_asdf_deps }}"
      when:
        - nodejs_lang.plugin_asdf_deps | length > 0
        - ansible_os_family | lower == 'debian'
      tags:
        - asdf
        - nodejs

    - name: ASDF-Nodejs | Ensure yum packages are managed | Redhat
      become: true
      ansible.builtin.yum:
        name: "{{ item }}"
        state: "{{ _apt_state }}"
      vars:
        state: '{{ _apt_state | default("present") }}'
      with_items:
        - "{{ nodejs_lang.plugin_asdf_deps }}"
      when:
        - nodejs_lang.plugin_asdf_deps | length > 0
        - ansible_os_family | lower == 'redhat'
      tags:
        - asdf
        - nodejs

    - name: ASDF-Nodejs | Install nodejs version
      become: true
      become_user: "{{ user_admin }}"
      ansible.builtin.shell: |
        /home/{{ user_admin }}/.local/bin/asdf install nodejs {{ nodejs_lang.plugin_asdf_nodejs_version }}
      args:
        executable: /bin/bash
      environment:
        PATH: "/home/{{ user_admin }}/.local/bin:{{ lookup('env', 'PATH') }}"
      changed_when: false
      register: nodejs_version_installed
      tags:
        - asdf
        - nodejs

    - name: ASDF-Nodejs | Set global for nodejs version on .tool_version
      become: true
      become_user: "{{ user_admin }}"
      ansible.builtin.shell: |
        /home/{{ user_admin }}/.local/bin/asdf set --home nodejs {{ nodejs_lang.plugin_asdf_nodejs_version }}
      args:
        executable: /bin/bash
      changed_when: false
      environment:
        PATH: "/home/{{ user_admin }}/.local/bin:{{ lookup('env', 'PATH') }}"
      when:
        - nodejs_version_installed is success
      tags:
        - asdf
        - nodejs
