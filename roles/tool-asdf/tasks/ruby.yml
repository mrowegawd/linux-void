---
- name: ASDF-Ruby | Check plugin-list if spesific our lang is exists
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    /home/{{ user_admin }}/.local/bin/asdf list ruby
  args:
    executable: /bin/bash
  register: plugin_ruby_exists
  changed_when: false
  failed_when: false
  ignore_errors: true
  tags:
    - asdf
    - ruby

# - name: ASDF-Ruby | Debug plugin_ruby_exists!
#   ansible.builtin.debug:
#     msg: "{{ plugin_ruby_exists.stdout.find('ruby') }}"

- name: ASDF-Ruby | Install asdf plugin for ruby
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    /home/{{ user_admin }}/.local/bin/asdf {{ ruby_lang.plugin_asdf_install }}
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - plugin_ruby_exists.stderr | length > 0
  tags:
    - asdf
    - ruby

- name: ASDF-Ruby | Check ruby version if exists
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    ruby --version
  args:
    executable: /bin/bash
  environment:
    PATH: "/home/{{ user_admin }}/.asdf/shims:{{ lookup('env', 'PATH') }}"
  register: ruby_version_cur_version
  changed_when: false
  failed_when: false
  ignore_errors: true
  tags:
    - asdf
    - ruby

- name: "ASDF-Ruby | Install ruby"
  when:
    - ruby_version_cur_version.stderr | length > 0
  tags:
    - asdf
    - ruby
  block:
    - name: ASDF-Ruby | Ensure apt packages are managed | Debian
      become: true
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items:
        - "{{ ruby_lang.plugin_asdf_deps }}"
      when:
        - ruby_lang.plugin_asdf_deps | length > 0
        - ansible_os_family | lower == 'debian'
      tags:
        - asdf
        - ruby

    - name: ASDF-Ruby | Ensure yum packages are managed | Redhat
      become: true
      ansible.builtin.yum:
        name: "{{ item }}"
        state: "{{ _apt_state }}"
      vars:
        state: '{{ _apt_state | default("present") }}'
      with_items:
        - "{{ ruby_lang.plugin_asdf_deps }}"
      when:
        - ruby_lang.plugin_asdf_deps | length > 0
        - ansible_os_family | lower == 'redhat'
      tags:
        - asdf
        - ruby

    - name: ASDF-Ruby | Install ruby version
      become: true
      become_user: "{{ user_admin }}"
      ansible.builtin.shell: |
        /home/{{ user_admin }}/.local/bin/asdf install ruby {{ ruby_lang.plugin_asdf_ruby_version }}
      args:
        executable: /bin/bash
      changed_when: false
      register: ruby_version_installed
      environment:
        PATH: "/home/{{ user_admin }}/.local/bin:{{ lookup('env', 'PATH') }}"
      tags:
        - asdf
        - ruby

    - name: ASDF-Ruby | Set global for ruby version on .tool_version
      become: true
      become_user: "{{ user_admin }}"
      ansible.builtin.shell: |
        /home/{{ user_admin }}/.local/bin/asdf set --home ruby {{ ruby_lang.plugin_asdf_ruby_version }}
      args:
        executable: /bin/bash
      changed_when: false
      environment:
        PATH: "/home/{{ user_admin }}/.local/bin:{{ lookup('env', 'PATH') }}"
      when:
        - ruby_version_installed is success
      tags:
        - asdf
        - ruby
