---
- name: ASDF-Go | Check plugin-list if spesific our lang is exists
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    /home/{{ user_admin }}/.local/bin/asdf list golang
  args:
    executable: /bin/bash
  environment:
    PATH: "/home/{{ user_admin }}/.local/bin:{{ lookup('env', 'PATH') }}"
  register: plugin_go_exists
  changed_when: false
  failed_when: false
  ignore_errors: true
  tags:
    - go
    - asdf

# - name: ASDF-Go | Debug plugin_go_exists test
#   ansible.builtin.debug:
#     msg: "{{ plugin_go_exists.stdout.find('golang') | int != 0}}"

- name: ASDF-Go | Install asdf plugin for golang
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    /home/{{ user_admin }}/.local/bin/asdf {{ go_lang.plugin_asdf_install }}
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - plugin_go_exists.stderr | length > 0
  tags:
    - go
    - asdf

- name: ASDF-Go | Check go version if exists
  become: true
  become_user: "{{ user_admin }}"
  ansible.builtin.shell: |
    go version
  args:
    executable: /bin/bash
  environment:
    PATH: "/home/{{ user_admin }}/.asdf/shims:{{ lookup('env', 'PATH') }}"
  register: go_version_cur_version
  changed_when: false
  failed_when: false
  ignore_errors: true
  tags:
    - go
    - asdf

# - name: ASDF-Go | Debug go_version_cur_version
#   ansible.builtin.debug:
#     msg: "{{ go_version_cur_version.stdout.find('go version') | int }}"
#
# - name: ASDF-Go | Debug go_version_cur_version
#   ansible.builtin.debug:
#     msg: "{{ go_version_cur_version.stdout }}"

- name: "ASDF-Go | Install go"
  when:
    - go_version_cur_version.stderr | length > 0
  tags:
    - asdf
    - go
  block:
    - name: ASDF-Go | Ensure apt packages are managed | Debian
      become: true
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items:
        - "{{ go_lang.plugin_asdf_deps }}"
      when:
        - go_lang.plugin_asdf_deps | length > 0
        - ansible_os_family | lower == 'debian'
      tags:
        - asdf
        - go

    - name: ASDF-Go | Ensure yum packages are managed | Redhat
      become: true
      ansible.builtin.yum:
        name: "{{ item }}"
        state: "{{ _apt_state }}"
      vars:
        state: '{{ _apt_state | default("present") }}'
      with_items:
        - "{{ go_lang.plugin_asdf_deps }}"
      when:
        - go_lang.plugin_asdf_deps | length > 0
        - ansible_os_family | lower == 'redhat'
      tags:
        - asdf
        - go

    - name: ASDF-Go | Install go version
      become: true
      become_user: "{{ user_admin }}"
      ansible.builtin.shell: |
        /home/{{ user_admin }}/.local/bin/asdf install golang {{ go_lang.plugin_asdf_go_version }}
      args:
        executable: /bin/bash
      changed_when: false
      register: go_version_installed
      tags:
        - asdf
        - go

    - name: ASDF-Go | Set global for go version on .tool_version
      become: true
      become_user: "{{ user_admin }}"
      ansible.builtin.shell: |
        /home/{{ user_admin }}/.local/bin/asdf set --home golang {{ go_lang.plugin_asdf_go_version }}
      args:
        executable: /bin/bash
      changed_when: false
      environment:
        PATH: "/home/{{ user_admin }}/.local/bin:{{ lookup('env', 'PATH') }}"
      when:
        - go_version_installed is success
      tags:
        - asdf
        - go
